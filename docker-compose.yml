services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Однонодовый replica set нужен для транзакций MongoDB.
  # Инициализируется один раз; API стартует только после того, как нода стала primary.
  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./docker/mongo/init-rs.sh:/init-rs.sh:ro
    entrypoint: ["bash", "/init-rs.sh"]

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      ConnectionStrings__Mongo: mongodb://mongo:27017/?replicaSet=rs0
      Mongo__Database: time_tracking
    ports:
      - "5080:8080"
    depends_on:
      mongo-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  mongo-data:
